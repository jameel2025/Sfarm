name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Check project structure
      run: |
        echo "Project contents:"
        ls -la
        echo "Gradle contents:"
        ls -la gradle/ || echo "No gradle folder"
        echo "App contents:"
        ls -la app/ || echo "No app folder"
        
    - name: Generate Gradle Wrapper (if missing)
      run: |
        if [ ! -f "./gradlew" ]; then
          echo "gradlew missing - generating wrapper"
          gradle wrapper
        else
          echo "gradlew exists - making executable"
          chmod +x ./gradlew
        fi
        
    - name: Build with Gradle
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew clean assembleDebug
        else
          gradle clean assembleDebug
        fi
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: app/build/outputs/apk/debug/
        retention-days: 30
